<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK-47 Rat Rod Cloud with Fall Animation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: transparent; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; background: transparent; }
    </style>
</head>
<body>

<canvas class="webgl"></canvas>

<script>
    // ЯДРО С ПОДДЕРЖКОЙ ДИНАМИЧЕСКИХ МАССИВОВ ДЛЯ АНИМАЦИИ ПАДЕНИЯ
    const threeCode = `
    (function(g,f){typeof exports==='object'&&typeof module!=='undefined'?f(exports):typeof define==='function'&&define.amd?define(['exports'],f):(g=typeof globalThis!=='undefined'?globalThis:g||self,f(g.THREE={}));})(this,function(exports){'use strict';
    function Scene(){this.type="Scene";this.children=[];}
    Scene.prototype={
        add:function(object){this.children.push(object);},
        remove:function(object){var idx=this.children.indexOf(object);if(idx!==-1)this.children.splice(idx,1);}
    };
    function PerspectiveCamera(fov,aspect,near,far){this.type="PerspectiveCamera";this.position={x:0,y:0,z:5};this.aspect=aspect||1;}
    PerspectiveCamera.prototype={updateProjectionMatrix:function(){}};
    function WebGLRenderer(parameters){var _c=parameters.canvas;this.domElement=_c;var _ctx=_c.getContext('2d');
    this.setSize=function(w,h){_c.width=w;_c.height=h;};
    this.render=function(scene,camera){
        _ctx.clearRect(0,0,_c.width,_c.height);
        var cx=_c.width/2,cy=_c.height/2;
        for(var i=0;i<scene.children.length;i++){
            var obj=scene.children[i];if(!obj||!obj.geometry)continue;
            var pos=obj.geometry.attributes.position.array;
            var col=obj.geometry.attributes.color.array;
            var rotY=obj.rotation.y;var cos=Math.cos(rotY),sin=Math.sin(rotY);
            for(var j=0;j<pos.length;j+=3){
                var x=pos[j],y=pos[j+1],z=pos[j+2];
                var rx=x*cos-z*sin;var rz=z*cos+x*sin;
                var p=400/(400+rz*20);
                var sx=cx+rx*140*p;var sy=cy+y*140*p;
                if(sx>=0&&sx<=_c.width&&sy>=0&&sy<=_c.height){
                    _ctx.fillStyle='rgb('+Math.floor(col[j]*255)+','+Math.floor(col[j+1]*255)+','+Math.floor(col[j+2]*255)+')';
                    _ctx.fillRect(sx,sy,2.5*p,2.5*p);
                }
            }
        }
    };}
    function BufferGeometry(){this.attributes={};}
    BufferGeometry.prototype={setAttribute:function(n,a){this.attributes[n]=a;return this;},dispose:function(){}};
    function Float32BufferAttribute(array,size){this.array=array;this.itemSize=size;}
    function PointsMaterial(p){this.size=p.size||1;this.vertexColors=p.vertexColors||false;}
    function Points(g,m){this.type="Points";this.geometry=g;this.material=m;this.rotation={y:0};}
    function Clock(){this.time=performance.now();}Clock.prototype={getElapsedTime:function(){return (performance.now()-this.time)/1000;}};
    exports.Scene=Scene;exports.PerspectiveCamera=PerspectiveCamera;exports.WebGLRenderer=WebGLRenderer;
    exports.BufferGeometry=BufferGeometry;exports.Float32BufferAttribute=Float32BufferAttribute;
    exports.PointsMaterial=PointsMaterial;exports.Points=Points;exports.Clock=Clock;exports.AdditiveBlending=1;
    });`;

    const blob = new Blob([threeCode], { type: 'application/javascript' });
    const script = document.createElement('script');
    script.src = URL.createObjectURL(blob);
    
    script.onload = () => { initParticlesApp(); };
    document.head.appendChild(script);

    function initParticlesApp() {
        const canvas = document.querySelector('canvas.webgl');
        
        try {
            const scene = new THREE.Scene();
            const parameters = { size: 0.04 };

            let geometry = null;
            let material = null;
            let points = null;

            // Массивы для хранения финальных (целевых) координат автомата
            let targetPositions = [];
            // Текущие динамические координаты частиц, которые будут меняться в анимации
            let currentPositions = [];
            let colors = [];

            const sizes = { width: window.innerWidth, height: window.innerHeight };
            const camera = new THREE.PerspectiveCamera(60, sizes.width / sizes.height, 0.1, 100);

            const renderer = new THREE.WebGLRenderer({ canvas: canvas });
            renderer.setSize(sizes.width, sizes.height);

            const image = new Image();
            image.crossOrigin = "anonymous";
            image.src = "ak-47_kolymaga.png"; 

            image.onload = () => {
                const imgCanvas = document.createElement('canvas');
                const ctx = imgCanvas.getContext('2d');
                
                const width = 190; 
                const height = Math.round((image.height / image.width) * width);
                imgCanvas.width = width;
                imgCanvas.height = height;
                ctx.drawImage(image, 0, 0, width, height);
                const imgData = ctx.getImageData(0, 0, width, height).data;

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const index = (y * width + x) * 4;
                        if (imgData[index + 3] > 40) {
                            // Финальная позиция автомата
                            const tX = (x - width / 2) * 0.04;
                            const tY = (y - height / 2) * 0.04;
                            const tZ = (Math.random() - 0.5) * 0.12;
                            targetPositions.push(tX, tY, tZ);

                            // Начальная позиция: выбрасываем точки высоко вверх (над экраном) с разбросом
                            currentPositions.push(
                                tX + (Math.random() - 0.5) * 2, // Небольшой хаотичный разброс в стороны
                                tY + 4 + Math.random() * 3,      // Высота падения (на 4-7 единиц выше автомата)
                                tZ + (Math.random() - 0.5) * 2
                            );

                            colors.push(imgData[index]/255, imgData[index+1]/255, imgData[index+2]/255);
                        }
                    }
                }

                geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(currentPositions), 3));
                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

                material = new THREE.PointsMaterial({
                    size: parameters.size,
                    vertexColors: true
                });

                points = new THREE.Points(geometry, material);
                scene.add(points);
            };

            window.addEventListener('resize', () => {
                sizes.width = window.innerWidth;
                sizes.height = window.innerHeight;
                renderer.setSize(sizes.width, sizes.height);
            });

            const clock = new THREE.Clock();
            
            const tick = () => {
                const elapsedTime = clock.getElapsedTime();

                if (points && currentPositions.length > 0) {
                    const posArray = points.geometry.attributes.position.array;

                    // Плавно двигаем каждую точку из начального верхнего положения к форме автомата
                    for (let i = 0; i < posArray.length; i++) {
                        // Магическая формула интерполяции (плавное торможение при приближении)
                        // Чем меньше значение (например, 0.03), тем медленнее и плавнее будут падать точки
                        posArray[i] += (targetPositions[i] - posArray[i]) * 0.04;
                    }

                    // Включаем вращение на 360 градусов вокруг оси Y
                    points.rotation.y = elapsedTime * 0.45; 
                }

                renderer.render(scene, camera);
                window.requestAnimationFrame(tick);
            };
            tick();
        } catch(e) {
            console.error("Сбой анимации:", e);
        }
    }
</script>

</body>
</html>
