<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK-47 Rat Rod Cloud</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background-color: #050505; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
    <!-- НОВАЯ ЖЕЛЕЗОБЕТОННАЯ ССЫЛКА НА THREE.JS (РАБОТАЕТ БЕЗ СКАЧИВАНИЯ ФАЙЛОВ) -->
    <script src="https://unpkg.com"></script>
</head>
<body>

<canvas class="webgl"></canvas>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Проверяем, подгрузилась ли библиотека из нового источника
        if (typeof THREE === 'undefined') {
            console.error("Ошибка сети: не удалось загрузить Three.js из резервного источника.");
            return;
        }

        const canvas = document.querySelector('canvas.webgl');
        const scene = new THREE.Scene();

        const parameters = {
            size: 0.04, // Размер светящихся точек
        };

        let geometry = null;
        let material = null;
        let points = null;

        const sizes = { width: window.innerWidth, height: window.innerHeight };
        
        const camera = new THREE.PerspectiveCamera(60, sizes.width / sizes.height, 0.1, 100);
        camera.position.z = 5; 
        scene.add(camera);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(sizes.width, sizes.height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Функция создания автомата из точек
        const generateWeaponParticles = (loadedImage) => {
            if(points !== null){
                geometry.dispose();
                material.dispose();
                scene.remove(points);
            }

            const imgCanvas = document.createElement('canvas');
            const ctx = imgCanvas.getContext('2d');
            
            const width = 160; 
            const height = Math.round((loadedImage.height / loadedImage.width) * width);
            imgCanvas.width = width;
            imgCanvas.height = height;
            
            ctx.drawImage(loadedImage, 0, 0, width, height);
            const imgData = ctx.getImageData(0, 0, width, height).data;

            const positions = [];
            const colors = [];

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const index = (y * width + x) * 4;
                    const r = imgData[index] / 255;
                    const g = imgData[index + 1] / 255;
                    const b = imgData[index + 2] / 255;
                    const alpha = imgData[index + 3] / 255;

                    if (alpha > 0.2) {
                        const posX = (x - width / 2) * 0.045;
                        const posY = -(y - height / 2) * 0.045;
                        const posZ = (Math.random() - 0.5) * 0.15; 

                        positions.push(posX, posY, posZ);
                        colors.push(r, g, b);
                    }
                }
            }

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            // ТВОЙ МАТЕРИАЛ POINTSMATERIAL
            material = new THREE.PointsMaterial({
                size: parameters.size,
                sizeAttenuation: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true
            });

            points = new THREE.Points(geometry, material);
            scene.add(points);
        };

        // Загружаем картинку, которая лежит рядом с index.html
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.src = "ak-47_kolymaga.png"; 

        image.onload = () => {
            generateWeaponParticles(image);
        };

        image.onerror = () => {
            console.error("Ошибка: картинка ak-47_kolymaga.png не найдена в твоей папке на GitHub!");
        };

        window.addEventListener('resize', () => {
            sizes.width = window.innerWidth;
            sizes.height = window.innerHeight;
            camera.aspect = sizes.width / sizes.height;
            camera.updateProjectionMatrix();
            renderer.setSize(sizes.width, sizes.height);
        });

        const clock = new THREE.Clock();

        // Бесконечное вращение на 360 градусов
        const tick = () => {
            const elapsedTime = clock.getElapsedTime();
            if(points) {
                points.rotation.y = elapsedTime * 0.4; 
            }
            renderer.render(scene, camera);
            window.requestAnimationFrame(tick);
        };

        tick();
    });
</script>

</body>
</html>
